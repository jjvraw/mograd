[workspace]
authors = ["Joshua James Venter <venter.joshua@gmail.com>"]
preview = ["pixi-build"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mograd"
platforms = ["linux-64", "osx-arm64"]
version = "0.0.0"

[package]
name = "mograd"
version = "0.0.0"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

[package.build-dependencies]
mojo-compiler = "*"

[package.host-dependencies]
mojo-compiler = "*"

[dependencies]
mojo = ">=1.0.0b2.dev2026050306,<2"
max = ">=26.4.0.dev2026052815,<27"
numpy = "*" # (LazyLoader)


[activation.env]
MOGRAD_SO = "mograd/runtime/gpu/kernels/libmograd_gpu.so"

[target.osx-arm64.tasks]
build-gpu = { cmd = "xcrun clang -c -fPIC -o mograd/runtime/gpu/kernels/pin.o mograd/runtime/gpu/kernels/pin.c && mojo build --emit shared-lib mograd/runtime/gpu/kernels/__init__.mojo -o $PIXI_PROJECT_ROOT/$MOGRAD_SO -Xlinker $PIXI_PROJECT_ROOT/mograd/runtime/gpu/kernels/pin.o" }

[environments]
lint = {features = ["lint"]}

[feature.lint.dependencies]
mojo = ">=1.0.0b2.dev2026050306,<2"

[feature.lint.tasks]
format-check = { cmd = "mojo format -l 120 mograd/ && git diff --exit-code" }

[tasks]
build-gpu = { cmd = "gcc -c -fPIC -o mograd/runtime/gpu/kernels/pin.o mograd/runtime/gpu/kernels/pin.c && mojo build --emit shared-lib mograd/runtime/gpu/kernels/__init__.mojo -o $PIXI_PROJECT_ROOT/$MOGRAD_SO -Xlinker $PIXI_PROJECT_ROOT/mograd/runtime/gpu/kernels/pin.o" }

format = { cmd = "mojo format -l 120 mograd/"}

# Tests
test-grad     = { cmd = "mojo -I . tests/test_grad.mojo" }
test-grad-b     = { cmd = "mojo -I . tests/test_grad.mojo", depends-on = ["build-gpu"]}
test-nn       = { cmd = "mojo -I . tests/test_nn.mojo" }
test-nn-b       = { cmd = "mojo -I . tests/test_nn.mojo", depends-on = ["build-gpu"]}
test-ops      = { cmd = "mojo -I . tests/test_ops.mojo", }
test-ops-b      = { cmd = "mojo -I . tests/test_ops.mojo", depends-on = ["build-gpu"]}
test-native-gpu-rewrites = { cmd = "mojo -I . tests/test_native_gpu_rewrites.mojo" }
test-pattern-matcher     = { cmd = "mojo -I . tests/test_pattern_matcher.mojo" }
test-layout               = { cmd = "mojo -I . tests/test_layout.mojo" }
test-data                = { cmd = "mojo -I . tests/test_data.mojo" }
test-graph               = { depends-on = ["test-pattern-matcher", "test-native-gpu-rewrites"] }
test-all                 = { depends-on = ["test-grad", "test-nn", "test-ops", "test-graph", "test-layout", "test-data"] }
test-all-b                 = { depends-on = ["build-gpu", "test-grad", "test-nn", "test-ops", "test-graph", "test-layout", "test-data"] }

# Examples
mnist     = { cmd = "mojo -I . examples/mnist/train.mojo" }
mnist-b     = { cmd = "mojo -I . examples/mnist/train.mojo", depends-on = ["build-gpu"]}
