[workspace]
authors = ["Joshua James Venter <venter.joshua@gmail.com>"]
preview = ["pixi-build"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mograd"
platforms = ["linux-64", "osx-arm64"]
version = "0.0.0"

[package]
name = "mograd"
version = "0.0.0"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

[package.build-dependencies]
mojo-compiler = "*"

[package.host-dependencies]
mojo-compiler = "*"

[dependencies]
mojo = ">=1.0.0b2.dev2026050306,<2"
max = ">=26.4.0.dev2026052815,<27"
numpy = "*" # (LazyLoader)


[activation.env]
MOGRAD_SO = "mograd/runtime/gpu/kernels/libmograd_gpu.so"

[environments]
lint = {features = ["lint"]}

[feature.lint.dependencies]
mojo = ">=1.0.0b2.dev2026050306,<2"

[feature.lint.tasks]
format-check = { cmd = "mojo format -l 120 mograd/ examples/ benches/ && git diff --exit-code" }

[tasks]
build-gpu = { cmd = "bash scripts/build_gpu.sh" }

format = { cmd = "mojo format -l 120 mograd/ examples/ benches/"}

# Test GPU
test-grad               = { cmd = "mojo -I . tests/test_grad.mojo" }
test-grad-b             = { cmd = "mojo -I . tests/test_grad.mojo", depends-on = ["build-gpu"]}
test-nn                 = { cmd = "mojo -I . tests/test_nn.mojo" }
test-nn-b               = { cmd = "mojo -I . tests/test_nn.mojo", depends-on = ["build-gpu"]}
test-ops                = { cmd = "mojo -I . tests/test_ops.mojo", }
test-ops-b              = { cmd = "mojo -I . tests/test_ops.mojo", depends-on = ["build-gpu"]}
test-data               = { cmd = "mojo -I . tests/test_data.mojo" }
test-data-b             = { cmd = "mojo -I . tests/test_data.mojo", depends-on = ["build-gpu"]}
test-non-contiguous     = { cmd = "mojo -I . tests/test_non_contiguous.mojo" }
test-non-contiguous-b   = { cmd = "mojo -I . tests/test_non_contiguous.mojo", depends-on = ["build-gpu"]}
test-gpu                = { depends-on = [  "test-grad",
                                            "test-nn",
                                            "test-ops",
                                            "test-data",
                                            "test-non-contiguous"] }
test-gpu-b              = { depends-on = [  "build-gpu", "test-gpu"] }

# Test Graph
test-gpu-rewrites       = { cmd = "mojo -I . tests/test_gpu_rewrites.mojo" }
test-pattern-matcher    = { cmd = "mojo -I . tests/test_pattern_matcher.mojo" }
test-layout             = { cmd = "mojo -I . tests/test_layout.mojo" }
test-custom-rules       = { cmd = "mojo -I . tests/test_custom_rules.mojo" }
test-ops-graph          = { cmd = "mojo -I . tests/test_ops_graph.mojo" }
test-graph              = { depends-on = [  "test-pattern-matcher",
                                            "test-gpu-rewrites",
                                            "test-layout",
                                            "test-custom-rules",
                                            "test-ops-graph"] }

# Examples
mnist                   = { cmd = "mojo -I . examples/mnist/train.mojo" }
mnist-b                 = { cmd = "mojo -I . examples/mnist/train.mojo", depends-on = ["build-gpu"]}
examples                = { depends-on = ["mnist"] }
examples-b              = { depends-on = ["build-gpu", "examples"] }

# Test All
test-all                = { depends-on = ["test-gpu", "test-graph", "examples"] }
test-all-b              = { depends-on = ["build-gpu", "test-all"] }

# Benchamrks
bench-elementwise       = { cmd = "mojo -I . benches/elementwise.mojo", depends-on = ["build-gpu"]}
bench-transpose         = { cmd = "mojo -I . benches/transpose.mojo", depends-on = ["build-gpu"]}
bench-matmul            = { cmd = "mojo -I . benches/matmul.mojo", depends-on = ["build-gpu"]}
