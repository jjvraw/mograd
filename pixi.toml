[workspace]
authors = ["Joshua James Venter <venter.joshua@gmail.com>"]
preview = ["pixi-build"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mograd"
platforms = ["linux-64"]
version = "0.0.0"

[package]
name = "mograd"
version = "0.0.0"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

[package.build-dependencies]
mojo-compiler = "*"

[package.host-dependencies]
mojo-compiler = "*"

[dependencies]
mojo = ">=1.0.0b2.dev2026050306,<2"
numpy = "*" # (LazyLoader)


[tasks]
format = { cmd = "mojo format -l 120 ."}

# Tests
test-grad = { cmd = "mojo -I . tests/test_grad.mojo" }
test-nn   = { cmd = "mojo -I . tests/test_nn.mojo" }
test-ops  = { cmd = "mojo -I . tests/test_ops.mojo" }
test-all  = { depends-on = ["test-grad", "test-nn", "test-ops"] }

# Examples
mnist     = { cmd = "mojo -I . examples/mnist/train.mojo" }
