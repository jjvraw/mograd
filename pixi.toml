[workspace]
authors = ["Joshua James Venter <venter.joshua@gmail.com>"]
preview = ["pixi-build"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mograd"
platforms = ["linux-64", "osx-arm64"]
version = "0.0.0"

[package]
name = "mograd"
version = "0.0.0"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

[package.build-dependencies]
mojo-compiler = "*"

[package.host-dependencies]
mojo-compiler = "*"

[dependencies]
mojo = "==1.0.0b3.dev2026062206"
max = "==26.5.0.dev2026062206"

[target.linux-64.dependencies]
gcc = "*"

[activation.env]
MOGRAD_SO = "$CONDA_PREFIX/lib/mograd/libmograd_gpu.so"

[environments]
lint = { features = ["lint"], no-default-feature = true }

[feature.lint.dependencies]
mojo = "==1.0.0b3.dev2026062206"

# ===-------------------------------------------------------------------===#
# Tasks
# ===-------------------------------------------------------------------===#

[feature.lint.tasks]
format-check            = { cmd = "mojo format -l 120 mograd/ tests/ examples/ benches/ && git diff --exit-code" }

[tasks]
ensure-gpu              = { cmd = "bash scripts/build_gpu.sh" }
build-gpu               = { cmd = "MOGRAD_FORCE_BUILD=1 bash scripts/build_gpu.sh" }

format                  = { cmd = "mojo format -l 120 mograd/ tests/ examples/ benches/"}

# Test Mograd GPU
test-grad               = { cmd = "mojo -I . tests/test_grad.mojo",             depends-on = ["ensure-gpu"] }
test-nn                 = { cmd = "mojo -I . tests/test_nn.mojo",               depends-on = ["ensure-gpu"] }
test-ops                = { cmd = "mojo -I . tests/test_ops.mojo",              depends-on = ["ensure-gpu"] }
test-data               = { cmd = "mojo -I . tests/test_data.mojo",             depends-on = ["ensure-gpu"] }
test-non-contiguous     = { cmd = "mojo -I . tests/test_non_contiguous.mojo",   depends-on = ["ensure-gpu"] }
test-scheduler          = { cmd = "mojo -I . tests/test_scheduler.mojo" }
test-debug              = { cmd = "mojo -D MOGRAD_DEBUG=3 -I . tests/test_debug.mojo", depends-on = ["ensure-gpu"] }
test-gpu                = { depends-on = [  "test-grad",
                                            "test-nn",
                                            "test-ops",
                                            "test-data",
                                            "test-non-contiguous",
                                            "test-scheduler"] }

# Test Mograd Graph
test-gpu-rewrites       = { cmd = "mojo -I . tests/test_gpu_rewrites.mojo" }
test-pattern-matcher    = { cmd = "mojo -I . tests/test_pattern_matcher.mojo" }
test-layout             = { cmd = "mojo -I . tests/test_layout.mojo" }
test-custom-rules       = { cmd = "mojo -I . tests/test_custom_rules.mojo" }
test-ops-graph          = { cmd = "mojo -I . tests/test_ops_graph.mojo" }
test-graph              = { depends-on = [  "test-pattern-matcher",
                                            "test-gpu-rewrites",
                                            "test-layout",
                                            "test-custom-rules",
                                            "test-ops-graph"] }

# Mograd Examples
mnist                   = { cmd = "mojo -I . examples/mnist/train.mojo",          depends-on = ["ensure-gpu"] }
tinyshakespear          = { cmd = "mojo -I . examples/tinyshakespear/train.mojo", depends-on = ["ensure-gpu"] }
examples-ci             = { depends-on = ["mnist"] }

# Mograd Test All
test-all                = { depends-on = ["test-gpu", "test-graph", "examples-ci"] }

# Test Custom Kernels
test-attention-mma      = { cmd = "mojo -I . tests/kernels/attention/mma.mojo",     depends-on = ["ensure-gpu"] }
test-attention-generic  = { cmd = "mojo -I . tests/kernels/attention/generic.mojo", depends-on = ["ensure-gpu"] }
test-attention-apple    = { cmd = "mojo -I . tests/kernels/attention/apple.mojo",   depends-on = ["ensure-gpu"] }
test-attention          = { depends-on = ["test-attention-mma", "test-attention-generic", "test-attention-apple"] }
test-kernels            = { depends-on = ["test-attention"] }

# Benchamrk Kernels
bench-elementwise       = { cmd = "mojo -I . benches/elementwise.mojo",         depends-on = ["ensure-gpu"] }
bench-transpose         = { cmd = "mojo -I . benches/transpose.mojo",           depends-on = ["ensure-gpu"] }
bench-matmul            = { cmd = "mojo -I . benches/matmul.mojo",              depends-on = ["ensure-gpu"] }
bench-attention         = { cmd = "mojo -I . benches/attention/dispatch.mojo", depends-on = ["ensure-gpu"] }
bench-attention-generic = { cmd = "mojo -I . benches/attention/generic.mojo",   depends-on = ["ensure-gpu"] }
bench-attention-apple   = { cmd = "mojo -I . benches/attention/apple.mojo",     depends-on = ["ensure-gpu"] }
